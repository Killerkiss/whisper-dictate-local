<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <!-- Recording: a filled circle, the universal record symbol, rather than a
       tinted microphone. At panel size a colour change alone is easy to miss
       and impossible to read for anyone with a red/green deficiency, so the
       three states differ in SHAPE first and colour second.

       Deliberately full-colour: a "-symbolic" icon gets recoloured to the
       panel foreground, which would throw the red away.

       Keep "<svg" within the first ~200 bytes; gdk-pixbuf sniffs the format
       from the head of the file and will refuse to load the icon otherwise. -->
  <circle cx="11" cy="11" r="6.5" fill="#e01b24"/>
</svg>

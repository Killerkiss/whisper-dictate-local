<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <!-- Transcribing: three dots, the usual "working on it" glyph. Distinct in
       shape from both the idle microphone and the recording circle, so the
       state is readable at a glance without relying on colour.

       Amber rather than the panel foreground, so a glance distinguishes
       "still working" from "listening" by colour as well as shape. -->
  <g fill="#e5a50a">
    <circle cx="4.5" cy="11" r="2.1"/>
    <circle cx="11"  cy="11" r="2.1"/>
    <circle cx="17.5" cy="11" r="2.1"/>
  </g>
</svg>
